qa_model:
  name: qwen3-8b
  model_name: Qwen/Qwen3-8B
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  enable_thinking: false
  max_tokens: 1024
  tokenize_output: false
  add_generation_prompt: true
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.8
  disable_log_stats: true
  trust_remote_code: true
  dtype: auto
  enable_lora: false
  lora_weight_path: null
  max_lora_rank: 32
confidence_extractor:
  name: semantic_uncertainty
  qa_template: vanilla
  sample_times: 10
dataset:
  grader_model:
    name: gpt-5-mini
  name: simple_qa
  url: https://huggingface.co/datasets/basicv8vc/SimpleQA/blob/main/simple_qa_test_set.csv
  file_path: llm_linguistic_confidence_study/datasets/simple_qa_test_set.csv
metrics:
  acc2:
    _target_: metrics.Accuracy
    name: acc
    format: simpleqa_like_exclude_training
    exclude_not_attempted: false
  acc:
    _target_: metrics.Accuracy
    name: acc
    format: simpleqa_like_exclude_training
    exclude_not_attempted: true
  ece2:
    _target_: metrics.ECE
    name: ece
    n_bins: 15
    format: simpleqa_like_exclude_training
    exclude_not_attempted: false
  ece:
    _target_: metrics.ECE
    name: ece
    n_bins: 15
    format: simpleqa_like_exclude_training
    exclude_not_attempted: true
  auroc2:
    _target_: metrics.AUROC
    name: auroc
    format: simpleqa_like_exclude_training
    exclude_not_attempted: false
  auroc:
    _target_: metrics.AUROC
    name: auroc
    format: simpleqa_like_exclude_training
    exclude_not_attempted: true
  attempted_count:
    _target_: metrics.AttemptedCount
    name: attempted_count
    format: simpleqa_like_exclude_training
    exclude_not_attempted: true
pre_runned_batch:
  qa_batch_id: llm_linguistic_confidence_study/prerunned_batch/simple_qa/qwen3-8b/semantic_uncertainty/vanilla-qwen3-8b.csv
  grader_batch_id: batch_68b8ea54bdf88190ace9c56dad271bbe
  semantic_ids_path: llm_linguistic_confidence_study/pretrained_weights/semantic_ids_qwen3-8b.npy
seed: 42
