qa_model:
  name: qwen3-8b-lora-mapper3
  model_name: Qwen/Qwen3-8B
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  enable_thinking: false
  max_tokens: 1024
  tokenize_output: false
  add_generation_prompt: true
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.8
  disable_log_stats: true
  trust_remote_code: true
  dtype: auto
  enable_lora: true
  lora_weight_path: improve_llm_linguistic_confidence/model/Qwen3-8B/8bit/mapper3
  max_lora_rank: 32
confidence_extractor:
  name: linguistic_confidence
  model_name: null
  state_dict_path: null
  mapper_name: direct-prompt
  qa_template: vanilla
  type: human_anno_dataset_trained
dataset:
  grader_model:
    name: gpt-5-mini
  name: simple_qa
  url: https://huggingface.co/datasets/basicv8vc/SimpleQA/blob/main/simple_qa_test_set.csv
  file_path: llm_linguistic_confidence_study/datasets/simple_qa_test_set.csv
metrics:
  acc2:
    _target_: metrics.Accuracy
    name: acc
    format: simpleqa_like
    exclude_not_attempted: false
    exclude_training: true
  acc:
    _target_: metrics.Accuracy
    name: acc
    format: simpleqa_like
    exclude_not_attempted: true
    exclude_training: true
  ece2:
    _target_: metrics.ECE
    name: ece
    n_bins: 15
    format: simpleqa_like
    exclude_not_attempted: false
    exclude_training: true
  ece:
    _target_: metrics.ECE
    name: ece
    n_bins: 15
    format: simpleqa_like
    exclude_not_attempted: true
    exclude_training: true
  auroc2:
    _target_: metrics.AUROC
    name: auroc
    format: simpleqa_like
    exclude_not_attempted: false
    exclude_training: true
  auroc:
    _target_: metrics.AUROC
    name: auroc
    format: simpleqa_like
    exclude_not_attempted: true
    exclude_training: true
  attempted_count:
    _target_: metrics.AttemptedCount
    name: attempted_count
    format: simpleqa_like
    exclude_not_attempted: true
    exclude_training: true
pre_runned_batch:
  qa_batch_id: llm_linguistic_confidence_study/prerunned_batch/simple_qa/qwen3-8b-lora-mapper3/linguistic_confidence/vanilla-qwen3-8b-lora-mapper3.csv
  grader_batch_id: batch_68bfbee0ae448190951bbeb3a1cf2a53
  ece_batch_id: batch_68c10e5f1b308190ab57e8f4b1dc084b
seed: 42
